<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Œuvre | Vif</title>
  <meta name="description" content="Toiles abstraites colorées imaginées avec l'IA, imprimées en qualité galerie et livrées en Europe.">
  <meta name="theme-color" content="#F4F4F2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EDEDEB'/%3E%3Ccircle cx='20' cy='12' r='7' fill='%23FF5A36'/%3E%3Cpath d='M4 30a10 10 0 0 1 20 0z' fill='%23FFC93C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500;1,6..96,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js (3D) chargé depuis un CDN -->
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
</head>
<body data-page="work" data-title="title.work">
  <header id="site-header"></header>
  <main id="work-main">
    <section class="wrap work-layout">
      <div class="wall-col">
        <div class="wall-stage" id="wall-stage" role="img" data-i18n-aria="work.stage" aria-label="Aperçu de l'œuvre accrochée dans une pièce"></div>
        <div class="segs" id="rooms" role="group" data-i18n-aria="work.room" aria-label="Pièce"></div>
        <p class="hint" data-i18n="work.drag">Faites glisser l'image pour tourner autour de la pièce.</p>
      </div>

      <div class="buy glass">
        <div>
          <h1 id="work-title"></h1>
          <p class="meta"><span data-i18n="card.technique">Imaginé par IA, impression sur toile</span>, <span data-i18n="work.year">2026</span></p>
        </div>
        <p id="work-text"></p>
        <fieldset>
          <legend data-i18n="work.size">Taille de la toile</legend>
          <div id="sizes" class="sizes"></div>
        </fieldset>
        <p class="note" id="work-scale" aria-live="polite"></p>
        <div class="price-row">
          <span class="price-big" id="work-price"></span>
          <span class="note" data-i18n="work.prices">Prix provisoires, livraison en sus.</span>
        </div>
        <button class="btn" id="add-to-cart" type="button" data-i18n="work.add">Ajouter au panier</button>
        <p class="note" data-i18n="work.soon">La boutique ouvre bientôt.</p>
        <div class="facts">
          <p data-i18n="work.details"></p>
          <p data-i18n="work.ai"></p>
        </div>
      </div>
    </section>

    <section class="wrap">
      <div class="section-head"><h2 data-i18n="work.more">D'autres œuvres</h2></div>
      <div class="gallery" id="more"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="js/pages/oeuvre.js"></script>
</body>
</html>
